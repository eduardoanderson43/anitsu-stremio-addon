services:
  - type: web
    name: anitsu-stremio-addon
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANITSU_REFRESH_TOKEN
        value: at4jx3pg4gwq
